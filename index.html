<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewels Blast 💎</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ======= LOADING SCREEN ======= -->
    <div id="loading-screen">
        <!-- Floating Jewels Background Animation -->
        <div class="floating-jewels">
            <span class="jewel j1">💎</span>
            <span class="jewel j2">🔴</span>
            <span class="jewel j3">🟢</span>
            <span class="jewel j4">🔵</span>
            <span class="jewel j5">🟡</span>
            <span class="jewel j6">🟣</span>
            <span class="jewel j7">💎</span>
            <span class="jewel j8">🟠</span>
            <span class="jewel j9">💎</span>
            <span class="jewel j10">🔴</span>
        </div>

        <!-- Main Content -->
        <div class="loading-content">
            <div class="logo-container">
                <div class="jewel-icon">💎</div>
                <h1 class="game-title">JEWELS</h1>
                <h1 class="game-title blast">BLAST</h1>
                <div class="subtitle">3 Games • Endless Fun</div>
            </div>

            <!-- Game Icons Preview -->
            <div class="game-preview">
                <div class="preview-item">
                    <span>🍬</span>
                    <small>Candy Crush</small>
                </div>
                <div class="preview-item">
                    <span>🧱</span>
                    <small>Block Blast</small>
                </div>
                <div class="preview-item">
                    <span>🔢</span>
                    <small>Number Link</small>
                </div>
            </div>

            <!-- Loading Bar -->
            <div class="loading-bar-container">
                <div class="loading-bar">
                    <div class="loading-fill" id="loading-fill"></div>
                </div>
                <div class="loading-text" id="loading-text">Loading... 0%</div>
            </div>
        </div>

        <!-- Bottom Tagline -->
        <div class="tagline">Made with ❤️ | Version 1.0</div>
    </div>

    <!-- ======= MAIN MENU (Hidden Initially) ======= -->
    <div id="main-menu" class="hidden">
        <h1>🎮 Main Menu Coming Next!</h1>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
