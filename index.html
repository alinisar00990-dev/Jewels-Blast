<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jewels Blast</title>
    <!-- Custom Magical Fantasy Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* RESET & BASE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background: #070514;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SCREEN CONTAINER */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* ============================================
           MAGICAL LOADING SCREEN (EXACT MATCH)
           ============================================ */
        #loading-screen {
            background: radial-gradient(circle at center, #1b1240 0%, #0d0726 50%, #050212 100%);
        }

        /* TWINKLING STARS BACKGROUND */
        .stars-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 6px #fff, 0 0 12px #a855f7;
            animation: twinkle linear infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* LOGO & TITLE SECTION */
        .logo-box {
            text-align: center;
            position: relative;
            z-index: 10;
            margin-bottom: 90px;
        }

        .title-word {
            font-family: 'Cinzel Decorative', serif;
            font-weight: 900;
            display: block;
            text-transform: capitalize;
            line-height: 1.1;
        }

        /* 3D GOLDEN TEXT EFFECT */
        .jewels-title {
            font-size: 3.8rem;
            background: linear-gradient(180deg, #fff6bb 0%, #ffd700 35%, #d49400 65%, #8a5a00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 10px rgba(255, 215, 0, 0.4));
            letter-spacing: 2px;
        }

        .blast-title {
            font-size: 4rem;
            background: linear-gradient(180deg, #fff9d4 0%, #ffe066 30%, #e6a100 65%, #996300 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 12px rgba(255, 224, 102, 0.4));
            letter-spacing: 3px;
            margin-top: -10px;
        }

        /* FANTASY DECORATIVE ORNAMENT */
        .title-ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 8px 0;
        }

        .ornament-line {
            height: 2px;
            width: 60px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
        }

        .ornament-gem {
            font-size: 1.2rem;
            color: #d8b4fe;
            filter: drop-shadow(0 0 8px #c084fc);
            animation: pulseGem 2s infinite ease-in-out;
        }

        @keyframes pulseGem {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px #c084fc); }
            50% { transform: scale(1.25); filter: drop-shadow(0 0 14px #e879f9); }
        }

        .subtitle {
            font-family: 'Cinzel', serif;
            color: #edd79c;
            font-size: 1.1rem;
            letter-spacing: 4px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
            margin-top: 5px;
            font-weight: 700;
        }

        /* ============================================
           MAGENTA/PURPLE GLOWING LOADING BAR
           ============================================ */
        .loading-box {
            position: absolute;
            bottom: 15%;
            width: 75%;
            max-width: 320px;
            text-align: center;
            z-index: 10;
        }

        .loading-track {
            width: 100%;
            height: 18px;
            background: rgba(10, 6, 28, 0.85);
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            padding: 3px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8), inset 0 2px 5px rgba(0, 0, 0, 0.9);
        }

        .loading-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #c084fc, #e879f9, #f43f5e);
            border-radius: 20px;
            box-shadow: 0 0 12px rgba(232, 121, 249, 0.9), 0 0 20px rgba(192, 132, 252, 0.6);
            transition: width 0.2s ease-out;
        }

        .loading-text {
            color: rgba(237, 215, 156, 0.75);
            font-size: 0.8rem;
            margin-top: 12px;
            letter-spacing: 2px;
            font-family: 'Cinzel', serif;
        }

        /* ============================================
           MAIN MENU SCREEN (FANTASY THEME)
           ============================================ */
        #menu-screen {
            background: radial-gradient(circle at center, #1b1240 0%, #0d0726 50%, #050212 100%);
            overflow-y: auto;
        }

        .menu-container {
            width: 100%;
            max-width: 400px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .menu-title-box {
            text-align: center;
            margin-bottom: 30px;
        }

        .menu-title-jewels {
            font-size: 2.4rem;
            background: linear-gradient(180deg, #fff6bb 0%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Cinzel Decorative', serif;
        }

        .menu-title-blast {
            font-size: 2.6rem;
            background: linear-gradient(180deg, #fff9d4 0%, #ffe066 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Cinzel Decorative', serif;
            margin-top: -8px;
        }

        .game-cards {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .game-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 215, 0, 0.6);
            box-shadow: 0 12px 30px rgba(168, 85, 247, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .card-icon {
            font-size: 2.8rem;
            margin-bottom: 6px;
        }

        .card-title {
            font-family: 'Cinzel', serif;
            color: #ffd700;
            font-size: 1.3rem;
            margin-bottom: 4px;
        }

        .card-desc {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
            margin-bottom: 14px;
        }

        .play-btn {
            padding: 10px 32px;
            border: none;
            border-radius: 20px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 0.9rem;
            color: #fff;
            cursor: pointer;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
            transition: transform 0.2s ease;
        }

        .play-btn:hover {
            transform: scale(1.06);
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 380px) {
            .jewels-title { font-size: 3rem; }
            .blast-title { font-size: 3.2rem; }
            .subtitle { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <!-- ============================================
         LOADING SCREEN (MATCHING YOUR IMAGE)
         ============================================ -->
    <div id="loading-screen" class="screen active">
        <!-- Twinkling background stars -->
        <div class="stars-container" id="stars-container"></div>

        <!-- Golden Game Title -->
        <div class="logo-box">
            <span class="title-word jewels-title">Jewels</span>
            
            <div class="title-ornament">
                <div class="ornament-line"></div>
                <div class="ornament-gem">✦</div>
                <div class="ornament-line"></div>
            </div>

            <span class="title-word blast-title">Blast</span>
            
            <!-- CHANGED TO MYSTERY WORLD 3 RIGHT HERE! -->
            <p class="subtitle">mystery world 3</p>
        </div>

        <!-- Magenta/Purple Glowing Loading Bar -->
        <div class="loading-box">
            <div class="loading-track">
                <div class="loading-fill" id="loading-fill"></div>
            </div>
            <p class="loading-text" id="loading-text">LOADING...</p>
        </div>
    </div>

    <!-- ============================================
         MAIN MENU SCREEN
         ============================================ -->
    <div id="menu-screen" class="screen">
        <div class="menu-container">
            <div class="menu-title-box">
                <div class="menu-title-jewels">Jewels</div>
                <div class="menu-title-blast">Blast</div>
            </div>

            <div class="game-cards">
                <div class="game-card" onclick="alert('Candy Crush is coming in Step 2!')">
                    <div class="card-icon">🍬</div>
                    <h2 class="card-title">Candy Crush</h2>
                    <p class="card-desc">Match 3 or more candies!</p>
                    <button class="play-btn">PLAY</button>
                </div>

                <div class="game-card" onclick="alert('Block Blast is coming in Step 3!')">
                    <div class="card-icon">🧱</div>
                    <h2 class="card-title">Block Blast</h2>
                    <p class="card-desc">Fill complete rows & columns!</p>
                    <button class="play-btn">PLAY</button>
                </div>

                <div class="game-card" onclick="alert('Number Link is coming in Step 4!')">
                    <div class="card-icon">🔢</div>
                    <h2 class="card-title">Number Link</h2>
                    <p class="card-desc">Connect matching numbers!</p>
                    <button class="play-btn">PLAY</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Generate floating twinkling stars
        function createStars() {
            const container = document.getElementById('stars-container');
            const starCount = 40;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.top = Math.random() * 100 + '%';
                star.style.left = Math.random() * 100 + '%';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                star.style.animationDelay = (Math.random() * 3) + 's';
                
                container.appendChild(star);
            }
        }

        // Animated Loading Progress
        let progress = 0;
        function animateLoading() {
            const fill = document.getElementById('loading-fill');
            const text = document.getElementById('loading-text');

            const interval = setInterval(() => {
                progress += Math.random() * 8 + 3;
                if (progress > 100) progress = 100;

                fill.style.width = progress + '%';
                text.textContent = `LOADING... ${Math.floor(progress)}%`;

                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        document.getElementById('loading-screen').classList.remove('active');
                        document.getElementById('menu-screen').classList.add('active');
                    }, 500);
                }
            }, 120);
        }

        document.addEventListener('DOMContentLoaded', () => {
            createStars();
            animateLoading();
        });
    </script>
</body>
</html>
