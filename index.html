<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Splash Animation</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 75px;
  background:
    radial-gradient(ellipse at top, #24345e 0%, #10152c 45%, #070912 100%);
  font-family: Arial, sans-serif;
}

.splash-title {
  position: relative;
  font-size: clamp(30px, 8vw, 64px);
  font-weight: 900;
  letter-spacing: 8px;
  color: transparent;
  background: linear-gradient(
    90deg,
    #80f7ff,
    #ffffff,
    #a28bff,
    #80f7ff
  );
  background-size: 250% auto;
  background-clip: text;
  -webkit-background-clip: text;
  filter: drop-shadow(0 0 12px #50dfff);
  animation:
    appear 1.2s cubic-bezier(.16,1,.3,1) both,
    float 3s ease-in-out 1.2s infinite,
    shine 4s linear infinite;
}

.splash-title::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -15px;
  width: 100%;
  height: 3px;
  border-radius: 50%;
  background: linear-gradient(
    90deg,
    transparent,
    #60f5ff,
    #ffffff,
    #9e7bff,
    transparent
  );
  box-shadow: 0 0 15px #60eaff;
  transform-origin: center;
  animation: lineReveal 1.4s ease-out both;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(45px) scale(.75);
    filter: blur(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: drop-shadow(0 0 12px #50dfff);
  }
}

@keyframes float {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 -9px; }
}

@keyframes shine {
  from { background-position: 100% center; }
  to { background-position: -150% center; }
}

@keyframes lineReveal {
  from { transform: scaleX(0); opacity: 0; }
  to { transform: scaleX(1); opacity: 1; }
}
</style>
</head>

<body>
  <div class="splash-title">ANIMATION</div>
</body>
</html>
